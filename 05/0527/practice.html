<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

        <div :class="{'is-required': countPeople <= 0}">
          <span>좋아요 : {{ countPeople }} 명 </span>
          <button @click="decreaseNum" :disabled="countPeople <= 0" >좋아요취소</button>
          <button @click="increaseNum" :disabled="countPeople >= 100">좋아요</button>
        </div>
        <hr>

       const countPeople = ref(0)

       }

</body>
